# --- Dev Tools ---
"flatpak:dev.zed.Zed" = "latest"
"flatpak:re.sonny.Commit" = "latest"
"flatpak:de.wwwtech.gitte" = "latest"
"flatpak:me.iepure.devtoolbox" = "latest"
"flatpak:com.mardojai.ForgeSparks" = "latest"
