"flatpak:io.github.alainm23.planify" = "latest"
"flatpak:org.gnome.World.Iotas" = "latest"
"flatpak:org.gnome.gitlab.cheywood.Pulp" = "latest"
"flatpak:org.gnome.gitlab.somas.Apostrophe" = "latest"
"flatpak:org.signal.Signal" = "latest"
"flatpak:re.sonny.Eloquent" = "latest"
