# ==============================================================================
# SYSTEM DIRECTORIES AND FILES (mise bootstrap files apply)
# ==============================================================================

# Writes ~/.config/mise/miserc.toml, mise's global environment-selection
# file, so every future `mise` invocation loads config.personal.toml without
# needing -E personal passed explicitly. Machine-specific, gitignored.
[bootstrap.files."~/.config/mise/miserc.toml"]
content = "env = [\"personal\"]\n"

[bootstrap.files."~/.ssh/config"]
content = "{{ secret(name=\"ssh_config_personal\") }}"
template = true
mode = "0600"

[bootstrap.directories."/etc/systemd/resolved.conf.d"]
owner = "root"
mode = "0755"

[bootstrap.files."/etc/systemd/resolved.conf.d/nextdns.conf"]
content = "{{ secret(name=\"nextdns_config\") }}"
template = true
owner = "root"
mode = "0644"
notify = ["systemd-resolved.service"]

# Replaces /etc/rpm-ostreed.conf for automatic staged updates
[bootstrap.files."/etc/rpm-ostreed.conf"]
source = "system_files/rpm-ostreed.conf"
owner = "root"
mode = "0644"
notify = ["rpm-ostreed-automatic.timer"]

# Sets up repository for VSCode to be layered
[bootstrap.files."/etc/yum.repos.d/vscode.repo"]
source = "system_files/vscode.repo"
owner = "root"
mode = "0644"

# ==============================================================================
# SYSTEM SERVICES (mise bootstrap services apply)
# Converges systemd units (both system-level timers and user sockets)
# ==============================================================================
[bootstrap.services."rpm-ostreed-automatic.timer"]
# Enables and starts the staged OS update timer on Silverblue
state = "running"
enabled = true

[bootstrap.services."systemd-resolved.service"]
# Already running by default; declared so the nextdns.conf notify above can
# restart it when the file changes
state = "running"
enabled = true
on_change = "restart"

# ==============================================================================
# LINUX SYSTEMD UNITS FOR AUTOMATIC UPDATES (mise bootstrap linux systemd-units apply)
# Creates systemd units for background updates (Flatpaks, Mise, Distrobox)
# ==============================================================================
[bootstrap.linux.systemd.units.automatic-daily-updates]
description = "Automatic daily background update for Flatpaks, Mise tools, and Distrobox containers"
type = "oneshot"
exec_start = "/usr/bin/bash -c 'flatpak update -y --noninteractive && %h/.local/bin/mise upgrade --yes && (command -v distrobox-upgrade &>/dev/null && distrobox-upgrade --all || true)'"
start = false
wanted_by = []

[bootstrap.linux.systemd.units.automatic-daily-updates-timer]
description = "Automatic daily background update timer for Flatpaks, Mise tools, and Distrobox containers"
on_calendar = "daily"
randomized_delay_sec = "30m"
persistent = true
unit = "workstation-auto-update"

# ==============================================================================
# PERSONAL TOOLS (mise install)
# ==============================================================================
[tools]
"github:yt-dlp/yt-dlp" = "latest"
"github:aaif-goose/goose" = "latest"
"aqua:earendil-works/pi" = "latest"
"aqua:anomalyco/opencode" = "latest"
"github:danielmiessler/fabric" = "latest"
"aqua:siderolabs/talos" = "latest"

# ==============================================================================
# HOOK: POST-TOOLS
# Runs immediately AFTER bootstrap.tools.
# Enables rootless Podman user socket for Dev Containers.
# ==============================================================================
[bootstrap.hooks.pre-tools]
run = "\"scripts/linux/post-tools.sh\""