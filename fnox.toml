# ==============================================================================
# FNOX CONFIGURATION (Secret Manager)
# Integrates with Bitwarden to expose secrets for mise bootstrap
# ==============================================================================
[providers.bitwarden]
type = "bitwarden"

[secrets]
GITHUB_SSH_KEY              = { provider = "bitwarden", value = "mise-github-auth-key/notes" }
MISE_GITHUB_TOKEN           = { provider = "bitwarden", value = "mise-github-token/notes" }
SSH_CONFIG_PERSONAL         = { provider = "bitwarden", value = "mise-ssh-config-personal/notes" }
SSH_CONFIG_WORK             = { provider = "bitwarden", value = "mise-ssh-config-work/notes" }
NEXTDNS_CONFIG              = { provider = "bitwarden", value = "mise-nextdns-conf/notes" }
